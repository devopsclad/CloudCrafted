name: Terraform Feature Branch Plan

on:
  push:
    branches:
      - 'feature/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-plan:

    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    defaults:
      run:
        working-directory: ./environments/DEV

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Gitleaks
      # Gitleaks is installed on the temporary GitHub-hosted Ubuntu runner
      - name: Install Gitleaks
        working-directory: .
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh \
            | sh -s -- -b /usr/local/bin

          gitleaks version

      # 3. Scan complete repository for secrets
      - name: Gitleaks Secret Scan
        working-directory: .
        run: |
          gitleaks detect \
            --source . \
            --config .github/gitleaks.toml \
            --redact \
            --verbose

      # 4. Login to Azure using Service Principal
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # 5. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 6. Check Terraform version
      - name: Terraform Version
        run: terraform version

      # 7. Terraform Format Check
      - name: Terraform Format Check
        run: terraform fmt -recursive

      # 8. Terraform Init with Azure Remote Backend
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=all_purpose_rg" \
            -backend-config="storage_account_name=stgsandboxinfra" \
            -backend-config="container_name=containersandboxinfra" \
            -backend-config="key=dev.tfstate"

      # 9. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 10. Terraform Plan
      - name: Terraform Plan
        run: terraform plan