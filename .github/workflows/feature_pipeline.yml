name: Terraform Feature Branch Plan

on:
  push:
    branches:
      - 'feature/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-plan:

    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    defaults:
      run:
        working-directory: ./environments/DEV

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login to Azure using Service Principal
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # 3. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Check Terraform version
      - name: Terraform Version
        run: terraform version

      # 5. Terraform Format
      - name: Terraform Format Check
        run: terraform fmt -recursive

      # 6. Terraform Init with Azure Remote Backend
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=msc_airtelrg" \
            -backend-config="storage_account_name=switchpahariya1" \
            -backend-config="container_name=pahariya" \
            -backend-config="key=dev.tfstate" \
            

      # 7. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 8. Terraform Plan
      - name: Terraform Plan
        run: terraform plan
